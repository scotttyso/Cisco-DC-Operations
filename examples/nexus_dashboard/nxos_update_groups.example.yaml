nexus_dashboard:
  host: nd.example.com
  username: netops
  domain: local
  verify_ssl: true
  password_env: DC_ND_PASSWORD

# Optional: replaces all built-in rules. First matching rule wins; N9K only.
# Quote versions. Omit this section to use these defaults automatically.
upgrade_rules:
  - models: ["*"]
    source_version: "9.3"
    target_version: "9.3.16"
  - models: ["*93180YC-EX*", "*93108TC-EX*"]
    source_version: "10.3"
    target_version: "10.3.10"
  - models: ["*"]
    source_version: "10.3"
    target_version: "10.6.4"
  # Verify the supported upgrade path before enabling this example.
  # - models: ["N9K-C93240YC-FX2"]
  #   source_version: "10.6"
  #   target_version: "10.6.4"

# Optional exact filename overrides for uploaded N9K NX-OS images.
# Present and Verified images are accepted; omit entries for automatic selection.
image_mappings: {}
# To pin images, replace the empty mapping above with:
# image_mappings:
#   "9.3.16": nxos.9.3.16.bin
#   "10.3.10": nxos64-cs.10.3.10.M.bin
#   "10.6.4": nxos64-cs.10.6.4.M.bin

update_groups:
  leaf-fx-10_6_4:
    hosts:
      - leaf101
      - leaf102
  border-ex-10_3_10:
    hosts:
      - 192.0.2.21
      - 192.0.2.22