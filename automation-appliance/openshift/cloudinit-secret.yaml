apiVersion: v1
kind: Secret
metadata:
  name: cisco-dc-cloudinit
  namespace: cisco-dc-automation
type: Opaque
stringData:
  userdata: |
    #cloud-config
    write_files:
      - path: /etc/cisco-dc-automation/appliance.env
        owner: root:root
        permissions: '0600'
        content: |
          HOSTNAME=dc-upgrade
          DOMAIN=example.com
          IP_SOURCE=DHCP
          TIMEZONE=Etc/UTC
          UI_ADMIN_USER=admin